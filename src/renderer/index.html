<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonts are bundled locally (see main.jsx), so nothing external is allowed.
       The one WebSocket permitted is the Vite dev server's, for hot reloads;
       a packaged build never opens it. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws://localhost:5173">
  <title>Acestes Agent</title>
  <link rel="stylesheet" href="./xterm.css">
  <link rel="stylesheet" href="./input.css">
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>
  <script type="module" src="./main.jsx"></script>
</body>

</html>
